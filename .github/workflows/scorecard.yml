# OpenSSF Scorecard: scores this repository's supply-chain practices.
#
# Runs on a public repository: weekly, on pushes to main and when branch rules
# change. On a private copy the job skips itself, because the Scorecard action
# runs on private repositories only with GitHub Advanced Security and
# publishing results (the badge and the api.scorecard.dev entry) needs a public
# repository.
#
# Publishing also restricts this file, and Scorecard rejects results from a
# workflow that breaks the rules: no top-level env or defaults, no write
# permissions at the top level, id-token: write only on the analysis job, and
# that job may use only actions/checkout, actions/upload-artifact,
# github/codeql-action/upload-sarif, ossf/scorecard-action and
# step-security/harden-runner (no run: steps).
name: Scorecard

on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "41 6 * * 3"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Upload results to code scanning.
      security-events: write
      # Publish results and enable the badge.
      id-token: write
      # Reads Scorecard needs on a private repository.
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # True on a public repository; false on a private one, which can't publish.
          publish_results: ${{ !github.event.repository.private }}

      - name: Keep the SARIF file as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
