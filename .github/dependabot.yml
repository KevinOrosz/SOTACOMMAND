# Dependabot keeps the SHA-pinned GitHub Actions current: it bumps the SHA and
# its version comment together, in one grouped pull request a week.
#
# The runtime tools are standard-library Python. The Ubuntu workflows use one
# integrity-locked npm package. GITLEAKS_VERSION and ACTIONLINT_REF in ci.yml
# are bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it, so a bad or compromised
    # release has time to be caught. Security updates skip the wait.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /.github/ci/claude
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
